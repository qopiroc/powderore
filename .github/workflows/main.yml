name: Build Powder Ores

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for f in *owderore*.zip; do unzip -o "$f"; done
          ls -R powderore | head -60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          build-root-directory: powderore

      - name: Build
        working-directory: powderore
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: powderore-jar
          path: powderore/build/libs/*.jar
